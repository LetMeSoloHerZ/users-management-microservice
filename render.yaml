# Blueprint de Render: crea el servicio web desde el Dockerfile.
# La base de datos vive en TiDB Cloud (MySQL compatible), no en Render.
# El despliegue lo dispara GitHub Actions (.github/workflows/deploy.yml) con un
# Deploy Hook; por eso el auto-deploy por commit esta desactivado.
# Las variables con sync:false se escriben a mano en el panel de Render y
# nunca se suben al repositorio.
services:
  - type: web
    name: aplicaciones-spring
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: users_management
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
